server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite hashes asset filenames, so the bundle is safe to cache permanently.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the current
    # asset hashes, so a cached copy pins visitors to the previous deploy — a
    # rebuilt container would then serve a shell pointing at files it no longer
    # has, and the app fails to boot with 404s on its own bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Same-origin API proxy, so the browser never makes a cross-origin
    # request and the backend needs no CORS configuration.
    location /v1/api/ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
}
