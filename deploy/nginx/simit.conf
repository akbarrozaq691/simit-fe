# SIMIT — nginx running on the host, replacing the containerised one in fe/.
#
# Install:
#   sudo cp deploy/nginx/simit-headers.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/simit.conf /etc/nginx/sites-available/simit
#   sudo ln -s /etc/nginx/sites-available/simit /etc/nginx/sites-enabled/simit
#   sudo rm -f /etc/nginx/sites-enabled/default   # or it keeps port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then TLS, which rewrites this file to add the 443 block and the redirect:
#   sudo certbot --nginx -d simit.example.com
#
# Replace simit.example.com and /var/www/simit throughout.

server {
    listen 80;
    listen [::]:80;
    server_name simit.example.com;

    # Where `npm run build` output was copied. Not the repo's fe/dist directly:
    # a deploy should not be able to break because someone ran a build halfway.
    root /var/www/simit;
    index index.html;

    # Hashed filenames make the bundle safe to cache forever.
    location /assets/ {
        include snippets/simit-headers.conf;
        # One directive, not `expires` as well: the two together emit two
        # Cache-Control headers for the same response.
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the new asset
    # hashes, so a cached copy pins visitors to the previous deploy.
    location = /index.html {
        include snippets/simit-headers.conf;
        add_header Cache-Control "no-store";
    }

    # SPA: unknown paths are client-side routes, not 404s.
    location / {
        include snippets/simit-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API proxy. This is why the backend carries no CORS
    # configuration at all — the browser only ever talks to this origin.
    location /v1/api/ {
        include snippets/simit-headers.conf;
        proxy_pass http://127.0.0.1:8888;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MAX_UPLOAD_MB is 10 and nginx defaults to 1m, so without this every
        # paper upload dies at the proxy with a 413 the app never sees. Kept
        # above the app's limit deliberately: the app should be the one to refuse
        # an oversized file, with its own message.
        client_max_body_size 25m;

        # A 10 MB PDF on a slow connection outlasts the 60s default, and a
        # timeout mid-upload looks like data loss to the author.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # FastAPI serves these from the root, not under the API prefix, so they are
    # already unreachable through this proxy. Refusing them explicitly means a
    # future change to the prefix cannot quietly publish the whole API surface.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;
    # Images and PDFs are already compressed; gzipping them costs CPU for nothing.
}
