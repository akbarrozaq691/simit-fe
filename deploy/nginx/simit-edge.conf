# SIMIT — nginx on the host acting as the edge, with the frontend still running
# as a container.
#
# Use THIS file when you keep `docker-compose up` in fe/. Use simit.conf instead
# when the host serves the built files directly. They are alternatives — enabling
# both means two server blocks competing for the same name.
#
#   browser → nginx (host, this file) → nginx (container, :3000) ─┬─ static files
#                                                                 └─ /v1/api → app
#
# Why bother with two layers: the container image builds the frontend with its
# own Node 22, so the server's Node version stops mattering, and TLS plus the
# domain live on the host where certbot can manage them.
#
# Install:
#   sudo cp deploy/nginx/simit-headers.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/simit-edge.conf /etc/nginx/sites-available/simit
#   sudo ln -s /etc/nginx/sites-available/simit /etc/nginx/sites-enabled/simit
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d simit.example.com
#
# And publish the container on loopback so it is reachable only through here:
#   FE_BIND=127.0.0.1 docker-compose up -d --build     (in fe/)

server {
    listen 80;
    listen [::]:80;
    server_name simit.example.com;

    location / {
        include snippets/simit-headers.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Every hop enforces its own body limit, and this is the first one. The
        # container's nginx already allows 25m, but nginx defaults to 1m — so
        # without this line a paper upload is refused here, before it ever
        # reaches the container.
        client_max_body_size 25m;

        # Same reasoning as the container config: a 10 MB PDF on a slow
        # connection outlasts the 60s default, and a timeout mid-upload looks
        # like data loss to the author.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;

        # Caching and gzip are left to the container, which knows which paths
        # hold hashed assets. Setting them here as well would mean two sources
        # of truth for the same headers.
    }
}
