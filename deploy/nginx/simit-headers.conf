# Response headers for every SIMIT location.
#
# In its own file because nginx does not inherit `add_header` into a location
# that declares any `add_header` of its own. Setting these once at server level
# silently drops them from exactly the responses that matter — the SPA shell and
# the bundle, both of which set their own Cache-Control. So every location
# includes this instead.
#
#   sudo cp deploy/nginx/simit-headers.conf /etc/nginx/snippets/

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No inline scripts are used. style-src allows inline because Tailwind injects a
# style element; frame-src is the Google Maps embed in the venue section; img-src
# allows https so CMS images served from object storage load.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.google.com; connect-src 'self'; base-uri 'self'; form-action 'self'" always;

# Uncomment once certbot has issued a certificate. Sending HSTS before HTTPS
# works tells browsers to refuse the site over plain HTTP — including yours.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
